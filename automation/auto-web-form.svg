  <text x="56" y="615" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">[응답] 탭에서 스프레드시트로 연결하면, 제출될 때마다 시트에 한 줄씩 자동으로 쌓인다</text>
