  <text x="56" y="555" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">질문 이름을 시트의 열 이름과 똑같이 맞춘다 — 이름이 다르면 나중에 손으로 옮겨야 한다</text>
