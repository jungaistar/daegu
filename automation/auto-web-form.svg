  <text x="56" y="585" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">질문 유형을 정확히 고른다. 금액은 숫자, 부서는 드롭다운 — 자유 입력이면 오타가 그대로 쌓인다</text>
  <circle cx="34" cy="610" r="12" fill="#F97316"/>
