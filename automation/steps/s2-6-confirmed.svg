<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-label="2교시 6단계 — 되물음에 답해 확정한 업무 정의서 화면">
  <title>2교시 6단계 — 되물음에 답해 확정한 업무 정의서 화면</title>
  <rect x="0" y="0" width="1000" height="550" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="390" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <text x="60" y="100" font-size="15" fill="#202124" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">확정 업무 정의서 — 3교시로 가져갈 문서</text><rect x="60" y="118" width="180" height="40" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="74" y="142.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">업무 이름</text><rect x="240" y="118" width="700" height="40" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><text x="254" y="142.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">신청 명단 중복 제거·정리</text><rect x="60" y="158" width="180" height="40" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="74" y="182.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">같은 사람 기준</text><rect x="240" y="158" width="700" height="40" fill="#FFF9EC" stroke="#D5DAE2" stroke-width="1"/><text x="254" y="182.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이름과 연락처가 모두 같으면 같은 사람</text><rect x="60" y="198" width="180" height="40" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="74" y="222.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">남길 행</text><rect x="240" y="198" width="700" height="40" fill="#FFF9EC" stroke="#D5DAE2" stroke-width="1"/><text x="254" y="222.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">먼저 접수된 행을 남긴다</text><rect x="60" y="238" width="180" height="40" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="74" y="262.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">지운 목록</text><rect x="240" y="238" width="700" height="40" fill="#FFF9EC" stroke="#D5DAE2" stroke-width="1"/><text x="254" y="262.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">삭제목록 시트에 따로 남긴다</text><rect x="60" y="278" width="180" height="40" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="74" y="302.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">정렬 순서</text><rect x="240" y="278" width="700" height="40" fill="#FFF9EC" stroke="#D5DAE2" stroke-width="1"/><text x="254" y="302.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">소속 가나다순</text><rect x="60" y="318" width="180" height="40" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="74" y="342.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">개인정보 처리</text><rect x="240" y="318" width="700" height="40" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><text x="254" y="342.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">연락처는 뒤 4자리만 남기고 가림</text><rect x="232" y="150" width="716" height="176" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="970" cy="238" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="970" y="243" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="52" y="310" width="896" height="56" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="338" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="343" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="60" y="360" width="166" height="24" rx="12" fill="#E6F4EA"/><text x="143" y="376.5" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3교시 설계 준비 완료</text><circle cx="320" cy="372" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="320" y="377" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="424" x2="986" y2="424" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="454" r="12" fill="#F97316"/><text x="34" y="459" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="459" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">앞 단계 되물음에 답한 내용을 칸으로 옮긴다 — 문장이 아니라 규칙으로 적는다</text><circle cx="34" cy="484" r="12" fill="#F97316"/><text x="34" y="489" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="489" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">개인정보를 어떻게 가릴지도 한 칸으로 적어 둔다. 6교시에서 이 줄을 그대로 검사한다</text><circle cx="34" cy="514" r="12" fill="#F97316"/><text x="34" y="519" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="519" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이 문서 한 장이 오늘 남은 시간 내내 쓰인다. 화면 캡처나 메모장에 저장해 둔다</text>
</svg>
