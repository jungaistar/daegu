  <title>4교시 4단계 — 받은 코드를 Apps Script 편집기에 붙여넣고 저장하는 화면</title>
  <rect x="0" y="0" width="1000" height="610" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="450" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><rect x="340" y="28" width="320" height="24" rx="12" fill="#E7EAEF"/><text x="500" y="45" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">script.google.com</text><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <rect x="60" y="96" width="60" height="26" rx="6" fill="#F1F3F4" stroke="#DADCE0" stroke-width="1"/><text x="90" y="113.5" font-size="12.5" fill="#3C4043" font-weight="400" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">저장</text><rect x="128" y="96" width="66" height="26" rx="6" fill="#1A73E8" stroke="#1A73E8" stroke-width="1"/><text x="161" y="113.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">▶ 실행</text><rect x="202" y="96" width="70" height="26" rx="6" fill="#F1F3F4" stroke="#DADCE0" stroke-width="1"/><text x="237" y="113.5" font-size="12.5" fill="#3C4043" font-weight="400" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">디버그</text><rect x="284" y="96" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="298" y="114" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">onOpen  ▾</text><rect x="60" y="134" width="860" height="288" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="1"/><text x="94" y="158" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">1</text><text x="108" y="158" font-size="12.5" fill="#5F8C3F" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">// 시트를 열 때 상단에 자동화 메뉴를 만든다</text><text x="94" y="180" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">2</text><text x="108" y="180" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">function onOpen() {</text><text x="94" y="202" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">3</text><text x="108" y="202" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  SpreadsheetApp.getUi()</text><text x="94" y="224" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">4</text><text x="108" y="224" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">    .createMenu(&quot;자동화&quot;)</text><text x="94" y="246" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">5</text><text x="108" y="246" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">    .addItem(&quot;명단 정리 실행&quot;, &quot;명단정리_실행&quot;)</text><text x="94" y="268" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">6</text><text x="108" y="268" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">    .addToUi();</text><text x="94" y="290" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">7</text><text x="108" y="290" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">}</text><text x="94" y="312" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">8</text><text x="108" y="312" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"></text><text x="94" y="334" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">9</text><text x="108" y="334" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">function 명단정리_실행() {</text><text x="94" y="356" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">10</text><text x="108" y="356" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const ss = SpreadsheetApp.getActive();</text><text x="94" y="378" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">11</text><text x="108" y="378" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const 원본 = ss.getSheetByName(&quot;신청접수&quot;);</text><text x="94" y="400" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">12</text><text x="108" y="400" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">}</text><rect x="52" y="126" width="876" height="304" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="278" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="283" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="52" y="88" width="76" height="42" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="90" cy="68" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="90" y="73" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="276" y="88" width="216" height="42" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="384" cy="68" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="384" y="73" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="484" x2="986" y2="484" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="514" r="12" fill="#F97316"/><text x="34" y="519" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="519" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">기존 내용을 모두 지우고 받은 코드를 통째로 붙여넣는다</text><circle cx="34" cy="544" r="12" fill="#F97316"/><text x="34" y="549" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="549" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">반드시 저장을 먼저 누른다 — 저장하지 않으면 메뉴가 생기지 않는다</text><circle cx="34" cy="574" r="12" fill="#F97316"/><text x="34" y="579" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="579" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이번에는 실행을 누르지 않는다. 메뉴로 실행할 것이므로 함수는 onOpen 이면 된다</text>
</svg>
