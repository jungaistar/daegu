 font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">3</text><text x="108" y="202" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const 원본 = ss.getSheetByName(&quot;신청접수&quot;);</text><text x="94" y="224" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">4</text><text x="108" y="224" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const 자료 = 원본.getDataRange().getValues().slice(1);</text><text x="94" y="246" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">5</text><text x="108" y="246" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  Logger.log(&quot;읽은 행 수: &quot; + 자료.length);</text><text x="94" y="268" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">6</text><text x="108" y="268" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">}</text><rect x="60" y="304" width="860" height="94" rx="8" fill="#F8F9FA" stroke="#E0E3E7" stroke-width="1"/><text x="76" y="326" font-size="12.5" fill="#3C4043" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">실행 로그</text><text x="76" y="350" font-size="12" fill="#5F6368" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">오후 2:24:40  알림  실행이 시작됨</text><text x="76" y="370" font-size="12" fill="#188038" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">오후 2:24:41  정보  읽은 행 수: 3</text><text x="76" y="390" font-size="12" fill="#5F6368" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">오후 2:24:41  알림  실행이 완료됨</text><rect x="52" y="142" width="876" height="38" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="950" cy="161" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="950" y="166" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="52" y="290" width="876" height="110" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="345" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="350" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text>
  <line x1="14" y1="454" x2="986" y2="454" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="484" r="12" fill="#F97316"/><text x="34" y="489" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="489" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">무엇이 바뀌었는지 한 줄만 눈으로 확인한다. 전부 이해하려 하지 않아도 된다</text><circle cx="34" cy="514" r="12" fill="#F97316"/><text x="34" y="519" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="519" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">다시 실행해 &quot;완료됨&quot; 이 나오면 이번 고리는 끝이다. 안 되면 새 오류를 또 통째로 넘긴다</text>
