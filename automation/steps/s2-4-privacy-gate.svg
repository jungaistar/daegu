  <rect x="14" y="14" width="972" height="400" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <text x="60" y="104" font-size="15" fill="#202124" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이 업무 자료를 외부 AI 에 그대로 올려도 되나 — 세 관문</text><rect x="60" y="122" width="880" height="48" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="137" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.4"/><text x="106" y="150.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">주민등록번호 · 외국인등록번호 · 운전면허번호가 들어 있다</text><rect x="876" y="134" width="46" height="24" rx="12" fill="#E6F4EA"/><text x="899" y="150.5" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">없음</text><rect x="60" y="170" width="880" height="48" fill="#FBFCFD" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="185" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 194 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="198.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이름 · 연락처 · 주소가 들어 있다</text><rect x="792" y="182" width="130" height="24" rx="12" fill="#FEF7E0"/><text x="857" y="198.5" font-size="12" fill="#B06000" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">있음 · 가명처리</text><rect x="60" y="218" width="880" height="48" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="233" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.4"/><text x="106" y="246.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">대외비 · 미공개 정책 자료가 들어 있다</text><rect x="876" y="230" width="46" height="24" rx="12" fill="#E6F4EA"/><text x="899" y="246.5" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">없음</text><rect x="60" y="266" width="880" height="48" fill="#FBFCFD" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="281" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.4"/><text x="106" y="294.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">위 셋이 모두 아니오이면 그대로 올려도 된다</text><rect x="840" y="278" width="82" height="24" rx="12" fill="#E8F0FE"/><text x="881" y="294.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">해당 없음</text><rect x="52" y="114" width="896" height="64" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="146" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="151" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="52" y="162" width="896" height="64" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="194" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="199" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="60" y="340" width="780" height="30" rx="15" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/><text x="76" y="360" font-size="13" fill="#9A3412" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">가명처리 = 이름을 A · B · C 로, 연락처를 지움. 원본은 내 PC 에만 둔다</text><circle cx="866" cy="355" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="866" y="360" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="434" x2="986" y2="434" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="464" r="12" fill="#F97316"/><text x="34" y="469" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="469" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">첫 줄에 하나라도 해당하면 이 업무는 오늘 대상에서 뺀다 — 예외가 없다</text><circle cx="34" cy="494" r="12" fill="#F97316"/><text x="34" y="499" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="499" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이름·연락처만 있으면 가명처리 후 쓸 수 있다. 지금 어떻게 가릴지 여기서 정한다</text><circle cx="34" cy="524" r="12" fill="#F97316"/><text x="34" y="529" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="529" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">판정 결과를 정의서 아래에 적어 둔다. 6교시 보안 점검에서 이 줄을 그대로 쓴다</text>
</svg>
