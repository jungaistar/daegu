th="2.5"/><text x="30" y="173" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="52" y="206" width="896" height="108" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="260" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="265" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="52" y="298" width="896" height="62" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="329" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="334" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="434" x2="986" y2="434" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="464" r="12" fill="#F97316"/><text x="34" y="469" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="469" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">숫자 대조가 먼저다. 합이 맞지 않으면 나머지를 볼 필요가 없다</text><circle cx="34" cy="494" r="12" fill="#F97316"/><text x="34" y="499" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="499" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">앞 단계에서 일부러 망가뜨린 자료가 제대로 처리됐는지 확인한다</text><circle cx="34" cy="524" r="12" fill="#F97316"/><text x="34" y="529" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="529" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">마지막 줄이 가장 중요하다 — 원본이 바뀌었다면 당장 쓰지 말고 코드를 다시 시킨다</text>
