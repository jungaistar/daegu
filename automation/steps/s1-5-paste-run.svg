<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="1교시 5단계 — Apps Script 편집기에 코드를 붙여넣고 함수를 고른 뒤 실행하는 화면">
  <title>1교시 5단계 — Apps Script 편집기에 코드를 붙여넣고 함수를 고른 뒤 실행하는 화면</title>
  <rect x="0" y="0" width="1000" height="650" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="460" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><rect x="340" y="28" width="320" height="24" rx="12" fill="#E7EAEF"/><text x="500" y="45" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">script.google.com</text><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <rect x="60" y="96" width="60" height="26" rx="6" fill="#F1F3F4" stroke="#DADCE0" stroke-width="1"/><text x="90" y="113.5" font-size="12.5" fill="#3C4043" font-weight="400" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">저장</text><rect x="128" y="96" width="66" height="26" rx="6" fill="#1A73E8" stroke="#1A73E8" stroke-width="1"/><text x="161" y="113.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">▶ 실행</text><rect x="202" y="96" width="70" height="26" rx="6" fill="#F1F3F4" stroke="#DADCE0" stroke-width="1"/><text x="237" y="113.5" font-size="12.5" fill="#3C4043" font-weight="400" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">디버그</text><rect x="284" y="96" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="298" y="114" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">부서별집계_만들기  ▾</text><rect x="60" y="134" width="860" height="288" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="1"/><text x="94" y="158" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">1</text><text x="108" y="158" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">function 부서별집계_만들기() {</text><text x="94" y="180" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">2</text><text x="108" y="180" font-size="12.5" fill="#5F8C3F" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  // 신청접수 시트를 찾아 자료를 통째로 읽는다</text><text x="94" y="202" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">3</text><text x="108" y="202" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const 원본 = SpreadsheetApp.getActive().getSheetByName(&quot;신청접수&quot;);</text><text x="94" y="224" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">4</text><text x="108" y="224" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const 자료 = 원본.getDataRange().getValues().slice(1);</text><text x="94" y="246" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">5</text><text x="108" y="246" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"></text><text x="94" y="268" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">6</text><text x="108" y="268" font-size="12.5" fill="#5F8C3F" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  // 부서 이름을 열쇠로 건수와 금액을 모은다</text><text x="94" y="290" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">7</text><text x="108" y="290" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const 집계 = {};</text><text x="94" y="312" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">8</text><text x="108" y="312" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  자료.forEach(행 =&gt; {</text><text x="94" y="334" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">9</text><text x="108" y="334" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">    const 부서 = 행[1];</text><text x="94" y="356" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">10</text><text x="108" y="356" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">    집계[부서] = 집계[부서] || { 건수: 0, 합계: 0 };</text><text x="94" y="378" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">11</text><text x="108" y="378" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  });</text><text x="94" y="400" font-size="11.5" fill="#9AA0A6" font-weight="400" text-anchor="end" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">12</text><text x="108" y="400" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">}</text><rect x="52" y="126" width="876" height="304" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="278" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="283" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="52" y="88" width="76" height="42" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="90" cy="68" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="90" y="73" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="276" y="88" width="216" height="42" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="384" cy="68" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="384" y="73" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><rect x="120" y="88" width="82" height="42" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="161" cy="68" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="161" y="73" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">4</text>
  <line x1="14" y1="494" x2="986" y2="494" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="524" r="12" fill="#F97316"/><text x="34" y="529" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="529" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">편집기에 원래 있던 내용을 모두 지우고 받은 코드를 통째로 붙여넣는다 — 한 글자도 고치지 않는다</text><circle cx="34" cy="554" r="12" fill="#F97316"/><text x="34" y="559" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="559" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">저장을 먼저 누른다. 저장하지 않고 실행하면 이전에 저장된 코드가 돈다</text><circle cx="34" cy="584" r="12" fill="#F97316"/><text x="34" y="589" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="589" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">실행할 함수 이름이 내 함수인지 확인한다 — 여기가 다른 이름이면 엉뚱한 것이 실행된다</text><circle cx="34" cy="614" r="12" fill="#F97316"/><text x="34" y="619" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">4</text><text x="56" y="619" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">실행을 누른다. 처음 한 번만 다음 단계의 권한 창이 뜬다</text>
</svg>
