<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="3교시 6단계 — 설계가 끝났는지 다섯 줄로 점검하는 화면">
  <title>3교시 6단계 — 설계가 끝났는지 다섯 줄로 점검하는 화면</title>
  <rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="400" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <text x="60" y="104" font-size="15" fill="#202124" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">4교시로 넘어가기 전 점검</text><rect x="60" y="122" width="880" height="46" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="136" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 145 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="149.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">시트 이름과 열 기호를 실제 시트와 한 글자도 다르지 않게 적었다</text><rect x="876" y="133" width="46" height="24" rx="12" fill="#E6F4EA"/><text x="899" y="149.5" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">확인</text><rect x="60" y="168" width="880" height="46" fill="#FBFCFD" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="182" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 191 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="195.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">사람이 누르는 곳이 하나뿐이다</text><rect x="876" y="179" width="46" height="24" rx="12" fill="#E6F4EA"/><text x="899" y="195.5" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">확인</text><rect x="60" y="214" width="880" height="46" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="228" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 237 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="241.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">원본 시트를 고치지 않고 결과를 새 시트에 쓴다</text><rect x="876" y="225" width="46" height="24" rx="12" fill="#E6F4EA"/><text x="899" y="241.5" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">확인</text><rect x="60" y="260" width="880" height="46" fill="#FBFCFD" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="274" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 283 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="287.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">빈 칸 · 표기 차이 · 0건일 때 어떻게 할지 적었다</text><rect x="876" y="271" width="46" height="24" rx="12" fill="#E6F4EA"/><text x="899" y="287.5" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">확인</text><rect x="60" y="306" width="880" height="46" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="320" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.4"/><text x="106" y="333.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">실행이 끝나면 사람에게 무엇을 보여 줄지 적었다</text><rect x="876" y="317" width="46" height="24" rx="12" fill="#FEF7E0"/><text x="899" y="333.5" font-size="12" fill="#B06000" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">아직</text><rect x="52" y="114" width="896" height="200" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="214" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="219" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="52" y="298" width="896" height="62" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="329" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="334" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="60" y="372" width="720" height="30" rx="15" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/><text x="76" y="392" font-size="13" fill="#9A3412" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">한 줄이라도 비어 있으면 4교시에서 반드시 되돌아오게 된다</text><circle cx="796" cy="387" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="796" y="392" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="434" x2="986" y2="434" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="464" r="12" fill="#F97316"/><text x="34" y="469" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="469" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">앞 네 줄은 명세서만 다시 보면 바로 채워진다. 비어 있으면 3교시를 끝내지 않는다</text><circle cx="34" cy="494" r="12" fill="#F97316"/><text x="34" y="499" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="499" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">마지막 줄이 가장 많이 빠진다 — 알림창 한 줄이면 충분하니 지금 적는다</text><circle cx="34" cy="524" r="12" fill="#F97316"/><text x="34" y="529" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="529" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">다섯 줄이 모두 채워진 명세서가 4교시 프롬프트의 본문이 된다</text>
</svg>
