<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="7교시 6단계 — 결재 상신용 한 장 요약 화면">
  <title>7교시 6단계 — 결재 상신용 한 장 요약 화면</title>
  <rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="400" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <text x="50" y="100" font-size="15" fill="#202124" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">결재 상신용 요약 — 한 장</text><rect x="50" y="118" width="130" height="42" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="64" y="143.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">제목</text><rect x="180" y="118" width="770" height="42" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><text x="194" y="143.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">행사 신청 명단 정리 업무 자동화 도구 부서 적용 계획</text><rect x="50" y="160" width="130" height="42" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="64" y="185.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">현황</text><rect x="180" y="160" width="770" height="42" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><text x="194" y="185.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">주 1회 40분 수작업, 최근 3개월 중복 안내 3건 발생</text><rect x="50" y="202" width="130" height="42" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="64" y="227.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">조치</text><rect x="180" y="202" width="770" height="42" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><text x="194" y="227.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">구글 시트 기반 자동 정리 도구를 제작하여 부서에 적용</text><rect x="50" y="244" width="130" height="42" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="64" y="269.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">효과</text><rect x="180" y="244" width="770" height="42" fill="#FFF9EC" stroke="#D5DAE2" stroke-width="1"/><text x="194" y="269.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">연간 30.4시간 절감, 중복 누락 연 3건 → 0건</text><rect x="50" y="286" width="130" height="42" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="64" y="311.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">일정</text><rect x="180" y="286" width="770" height="42" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><text x="194" y="311.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1주 시범 → 2주 팀 공유 → 3주 부서 적용</text><rect x="50" y="328" width="130" height="42" fill="#F7F9FC" stroke="#D5DAE2" stroke-width="1"/><text x="64" y="353.5" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">소요 예산</text><rect x="180" y="328" width="770" height="42" fill="#FFF9EC" stroke="#D5DAE2" stroke-width="1"/><text x="194" y="353.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">없음 (기존 구글 계정 기능 사용)</text><rect x="42" y="236" width="916" height="58" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="265" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="270" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="42" y="320" width="916" height="58" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="349" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="354" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="50" y="370" width="142" height="24" rx="12" fill="#E6F4EA"/><text x="121" y="386.5" font-size="12" fill="#188038" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">7교시 산출물 완성</text><circle cx="290" cy="382" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="290" y="387" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="434" x2="986" y2="434" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="464" r="12" fill="#F97316"/><text x="34" y="469" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="469" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">효과 칸을 맨 위로 올려 읽히게 한다. 결재자는 이 한 줄을 먼저 본다</text><circle cx="34" cy="494" r="12" fill="#F97316"/><text x="34" y="499" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="499" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">예산이 들지 않는다는 사실을 반드시 적는다 — 승인 속도가 가장 크게 달라지는 칸이다</text><circle cx="34" cy="524" r="12" fill="#F97316"/><text x="34" y="529" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="529" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이 한 장이 7교시의 결과물이다. 8교시에서 이 내용을 3분 발표로 줄인다</text>
</svg>
