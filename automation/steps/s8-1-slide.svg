<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-label="8교시 1단계 — 3분 발표용 한 장 슬라이드 화면">
  <title>8교시 1단계 — 3분 발표용 한 장 슬라이드 화면</title>
  <rect x="0" y="0" width="1000" height="590" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="430" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <rect x="90" y="104" width="820" height="280" rx="10" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><rect x="90" y="104" width="820" height="6" fill="#0E6BA8"/><text x="120" y="156" font-size="20" fill="#0D2740" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">신청 명단 정리 자동화 — 주 40분을 2분으로</text><circle cx="128" cy="196" r="5" fill="#F97316"/><text x="146" y="201" font-size="14" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">지금 — 주 1회 40분 수작업, 3개월간 중복 안내 3건</text><circle cx="128" cy="230" r="5" fill="#F97316"/><text x="146" y="235" font-size="14" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">도구 — 시트 메뉴 한 번으로 중복 제거·정렬·기록까지</text><circle cx="128" cy="264" r="5" fill="#F97316"/><text x="146" y="269" font-size="14" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">효과 — 연 30.4시간 절감, 중복 누락 0건</text><circle cx="128" cy="298" r="5" fill="#F97316"/><text x="146" y="303" font-size="14" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">적용 — 1주 시범 → 3주 부서 전체, 예산 0원</text><text x="120" y="360" font-size="12" fill="#6B7280" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">복지정책과 · 정○○</text><rect x="112" y="124" width="716" height="48" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="470" cy="192" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="470" y="197" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="112" y="174" width="776" height="44" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="910" cy="196" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="910" y="201" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="112" y="242" width="776" height="44" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="910" cy="264" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="910" y="269" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="464" x2="986" y2="464" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="494" r="12" fill="#F97316"/><text x="34" y="499" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="499" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">제목 한 줄에 결과를 넣는다 — &quot;무엇을 얼마나&quot; 가 제목에 있으면 발표는 절반이 끝난다</text><circle cx="34" cy="524" r="12" fill="#F97316"/><text x="34" y="529" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="529" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">지금 · 도구 · 효과 · 적용 네 줄이면 3분이 채워진다. 다섯 줄을 넘기지 않는다</text><circle cx="34" cy="554" r="12" fill="#F97316"/><text x="34" y="559" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="559" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">효과 줄은 숫자만 읽는다. 설명을 붙이면 시간이 모자란다</text>
</svg>
