<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 748" width="980" height="748" role="img" aria-label="Gemini 파일 요약 화면 — 파일 업로드, 문서 한정 지시, 쪽수 확인">
  <title>Gemini 파일 요약 화면 — 파일 업로드, 문서 한정 지시, 쪽수 확인</title>
  <rect width="980" height="748" fill="#FFFFFF"/>

  <!-- 브라우저 창 -->
  <rect x="14" y="14" width="952" height="582" rx="16" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/>
  <path d="M14 30 a16 16 0 0 1 16 -16 h920 a16 16 0 0 1 16 16 v26 h-952 z" fill="#F3F5F8"/>
  <circle cx="40" cy="42" r="6" fill="#FF5F57"/>
  <circle cx="60" cy="42" r="6" fill="#FEBC2E"/>
  <circle cx="80" cy="42" r="6" fill="#28C840"/>
  <rect x="336" y="30" width="308" height="24" rx="12" fill="#E7EAEF"/>
  <text x="490" y="47" font-size="13" fill="#6B7280" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">gemini.google.com</text>

  <!-- 사이드바 -->
  <line x1="234" y1="56" x2="234" y2="596" stroke="#E6E8EC" stroke-width="1.5"/>
  <rect x="26" y="76" width="188" height="32" rx="9" fill="#4285F4"/>
  <text x="120" y="97" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">+ 새 채팅</text>
  
    <rect x="26" y="120" width="188" height="28" rx="8" fill="#EDF1F6"/>
    <text x="40" y="139" font-size="12.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">새 대화</text>
    <rect x="26" y="158" width="188" height="28" rx="8" fill="none"/>
    <text x="40" y="177" font-size="12.5" fill="#7B828C" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">지난 회의록 정리</text>
    <rect x="26" y="196" width="188" height="28" rx="8" fill="none"/>
    <text x="40" y="215" font-size="12.5" fill="#7B828C" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">예산 자료 요약</text>

  <!-- 본문 -->
  <text x="286" y="94" font-size="17" font-weight="700" fill="#111827" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">Gemini — 파일 요약</text>
  
    <rect x="472" y="122" width="470" height="87" rx="12" fill="#EAF2FA" stroke="#CBDDEE"/><text x="488" y="148" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">[업로드] 2026_경로당_보수사업_계획.pdf</text><text x="488" y="169" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이 문서만 근거로 5줄 요약해 줘.</text><text x="488" y="190" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">각 줄 끝에 쪽수를 괄호로 표시해 줘.</text>
    <rect x="286" y="244" width="632" height="150" rx="12" fill="#F7F8FA" stroke="#E6E8EC"/><text x="302" y="270" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">노후 경로당 보수 지원 사업 계획서입니다. (1쪽)</text><text x="302" y="291" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">· 대상 — 보수가 필요한 관내 경로당 (2쪽)</text><text x="302" y="312" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">· 기간 — 9월 1일 ~ 9월 19일 (3쪽)</text><text x="302" y="333" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">· 서류 — 신청서, 시설 사진, 견적서 (3쪽)</text><text x="302" y="354" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">· 심사 — 노후도·이용 인원 순 (5쪽)</text><text x="302" y="375" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">· 총 예산 — 문서에서 확인되지 않습니다</text>

  <!-- 입력창 -->
  <rect x="286" y="504" width="656" height="60" rx="14" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.5"/>
  <circle cx="318" cy="534" r="15" fill="#EDF1F5"/>
  <path d="M312 529 l7 -7 a4.5 4.5 0 0 1 6.4 6.4 l-9 9 a7 7 0 0 1 -10 -10 l9 -9"
        fill="none" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round"/>
  <text x="344" y="539" font-size="13.5" fill="#9AA1AB" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">Gemini에게 물어보기</text>
  <rect x="886" y="518" width="42" height="32" rx="9" fill="#4285F4"/>
  <path d="M900 540 l7 -8 l7 8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="280" y="498" width="668" height="72" rx="12" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  
    <circle cx="236" cy="534" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="236" y="539" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text>

  <rect x="466" y="116" width="482" height="99" rx="12" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="280" y="238" width="644" height="162" rx="12" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  
  
    <circle cx="236" cy="140" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="236" y="145" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text>
    <circle cx="236" cy="262" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="236" y="267" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>

  <!-- 범례 -->
  <line x1="14" y1="618" x2="966" y2="618" stroke="#E6E8EC" stroke-width="1.5"/>
  
    <circle cx="34" cy="648" r="12" fill="#F97316"/>
    <text x="34" y="653" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text>
    <text x="56" y="653" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">입력창의 ＋ 를 눌러 PDF·한글·엑셀을 올린다 (드라이브에서도 바로 선택)</text>
    <circle cx="34" cy="678" r="12" fill="#F97316"/>
    <text x="34" y="683" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text>
    <text x="56" y="683" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">"이 문서만 근거로" 를 반드시 넣는다 — 없으면 인터넷 내용으로 답할 수 있다</text>
    <circle cx="34" cy="708" r="12" fill="#F97316"/>
    <text x="34" y="713" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
    <text x="56" y="713" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">각 항목 끝에 쪽수가 붙었는지 확인한다</text>
</svg>
