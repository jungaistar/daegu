<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 642" width="1000" height="642" role="img" aria-label="메타 프롬프트 5단계 흐름 — 붙여넣기, 질문, 번호 답, 완성 프롬프트, 되돌아가 고치기">
  <title>메타 프롬프트 5단계 흐름 — 붙여넣기, 질문, 번호 답, 완성 프롬프트, 되돌아가 고치기</title>
  <rect width="1000" height="642" fill="#FFFFFF"/>

  <rect x="150" y="30" width="800" height="66" rx="12" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/>
  <rect x="150" y="30" width="6" height="66" rx="3" fill="#0E6BA8"/>
  <text x="176" y="59" font-size="11.5" fill="#0E6BA8" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">STEP 1</text>
  <text x="240" y="59" font-size="15" fill="#111827" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">메타 프롬프트를 붙여넣는다</text>
  <text x="176" y="81" font-size="12.5" fill="#6B7280" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">새 대화창 첫 메시지로. 이미지 작업 무엇이든 이 하나로 시작</text>
  
  <circle cx="108" cy="63" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="108" y="68" font-size="14" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">1</text>
  <path d="M500 96 v26" stroke="#B6C0CC" stroke-width="2"/>
  <path d="M494 116 l6 6 l6 -6" fill="none" stroke="#B6C0CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="122" width="800" height="66" rx="12" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/>
  <rect x="150" y="122" width="6" height="66" rx="3" fill="#38B6FF"/>
  <text x="176" y="151" font-size="11.5" fill="#38B6FF" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">STEP 2</text>
  <text x="240" y="151" font-size="15" fill="#111827" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">AI가 한 가지씩 묻는다</text>
  <text x="176" y="173" font-size="12.5" fill="#6B7280" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">보기를 3~4개 주고 번호로 답하게 한다</text>
  
  <circle cx="108" cy="155" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="108" y="160" font-size="14" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">2</text>
  <path d="M500 188 v26" stroke="#B6C0CC" stroke-width="2"/>
  <path d="M494 208 l6 6 l6 -6" fill="none" stroke="#B6C0CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="214" width="800" height="66" rx="12" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/>
  <rect x="150" y="214" width="6" height="66" rx="3" fill="#38B6FF"/>
  <text x="176" y="243" font-size="11.5" fill="#38B6FF" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">STEP 3</text>
  <text x="240" y="243" font-size="15" fill="#111827" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">번호로만 답한다</text>
  <text x="176" y="265" font-size="12.5" fill="#6B7280" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">모르면 "네가 무난한 걸로 골라 줘"</text>
  
  <circle cx="108" cy="247" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="108" y="252" font-size="14" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">3</text>
  <path d="M500 280 v26" stroke="#B6C0CC" stroke-width="2"/>
  <path d="M494 300 l6 6 l6 -6" fill="none" stroke="#B6C0CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="306" width="800" height="66" rx="12" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/>
  <rect x="150" y="306" width="6" height="66" rx="3" fill="#0E6BA8"/>
  <text x="176" y="335" font-size="11.5" fill="#0E6BA8" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">STEP 4</text>
  <text x="240" y="335" font-size="15" fill="#111827" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">완성 프롬프트가 나온다</text>
  <text x="176" y="357" font-size="12.5" fill="#6B7280" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">코드 블록 하나로. 복사해서 이미지 도구에 붙여넣는다</text>
  
  <circle cx="108" cy="339" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="108" y="344" font-size="14" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">4</text>
  <path d="M500 372 v26" stroke="#B6C0CC" stroke-width="2"/>
  <path d="M494 392 l6 6 l6 -6" fill="none" stroke="#B6C0CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="398" width="800" height="66" rx="12" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/>
  <rect x="150" y="398" width="6" height="66" rx="3" fill="#084D7C"/>
  <text x="176" y="427" font-size="11.5" fill="#084D7C" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">STEP 5</text>
  <text x="240" y="427" font-size="15" fill="#111827" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">아쉬우면 메타 프롬프트로 돌아온다</text>
  <text x="176" y="449" font-size="12.5" fill="#6B7280" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이미지 도구가 아니라 여기서 고쳐야 다음에도 쓴다</text>
  
  <circle cx="108" cy="431" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="108" y="436" font-size="14" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">5</text>
  <path d="M956 431 h20 a10 10 0 0 0 10 -10 v-348 a10 10 0 0 0 -10 -10 h-20"
        fill="none" stroke="#F5B37A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="970" y="234" font-size="11.5" fill="#C2410C" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">다시</text>
  <line x1="14" y1="516" x2="986" y2="516" stroke="#E6E8EC" stroke-width="1.5"/>

  <circle cx="34" cy="546" r="12" fill="#F97316"/>
  <text x="34" y="551" font-size="13" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">1</text>
  <text x="56" y="551" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">외울 것은 이 그림 하나뿐 — 프롬프트 쓰는 법을 몰라도 STEP 1 만 붙여넣으면 시작된다</text>
  <circle cx="34" cy="576" r="12" fill="#F97316"/>
  <text x="34" y="581" font-size="13" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">2</text>
  <text x="56" y="581" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">질문이 열 번을 넘어가면 "다섯 가지만 묻고 끝내 줘" 라고 다시 보낸다</text>
  <circle cx="34" cy="606" r="12" fill="#F97316"/>
  <text x="34" y="611" font-size="13" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">3</text>
  <text x="56" y="611" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">고칠 때는 반드시 메타 프롬프트 대화창으로 — 여기서 고쳐야 다음 달에도 그대로 쓴다</text>
</svg>
