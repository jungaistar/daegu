  <text x="56" y="629" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">얼굴이 정면으로 크게 나온 사진 한 장을 붙인다 — 옆모습·단체사진은 결과가 나쁘다</text>
