  <text x="56" y="719" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">고칠 곳은 번호를 집어 한 장씩 — 전체를 다시 만들면 앞의 마음에 든 장까지 바뀐다</text>
