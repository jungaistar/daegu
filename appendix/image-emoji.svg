  <text x="56" y="689" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">여섯 장의 그림체가 서로 같은지 먼저 본다. 다르면 "여섯 장을 같은 그림체로" 다시 요청</text>
