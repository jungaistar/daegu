  <text x="56" y="659" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">"얼굴 특징 유지" · 표정 개수 · 배경 투명 · 그림체 · 정사각형 다섯 가지를 함께 적는다</text>
