<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-label="4교시 3단계 — 메뉴 코드와 실행 코드가 한 덩어리로 온 화면">
  <title>4교시 3단계 — 메뉴 코드와 실행 코드가 한 덩어리로 온 화면</title>
  <rect x="0" y="0" width="1000" height="590" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="460" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <text x="50" y="90" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">ChatGPT · Claude · Gemini</text><rect x="50" y="104" width="880" height="326" rx="10" fill="#F8F9FA" stroke="#E0E3E7" stroke-width="1"/><text x="52" y="91" font-size="11.5" fill="#6B7280" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">AI</text><text x="64" y="124" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">// 시트를 열 때 상단에 자동화 메뉴를 만든다</text><text x="64" y="144" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">function onOpen() {</text><text x="64" y="164" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  SpreadsheetApp.getUi()</text><text x="64" y="184" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">    .createMenu(&quot;자동화&quot;)</text><text x="64" y="204" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">    .addItem(&quot;명단 정리 실행&quot;, &quot;명단정리_실행&quot;)</text><text x="64" y="224" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">    .addToUi();</text><text x="64" y="244" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">}</text><text x="64" y="264" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"></text><text x="64" y="284" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">function 명단정리_실행() {</text><text x="64" y="304" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const ss = SpreadsheetApp.getActive();</text><text x="64" y="324" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const 원본 = ss.getSheetByName(&quot;신청접수&quot;);</text><text x="64" y="344" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  // 2행부터 끝까지 읽는다 (1행은 제목)</text><text x="64" y="364" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const 자료 = 원본.getDataRange().getValues().slice(1);</text><text x="64" y="384" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  ...</text><text x="64" y="404" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">}</text><rect x="42" y="96" width="896" height="162" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="960" cy="177" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="960" y="182" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="42" y="260" width="896" height="142" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="960" cy="331" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="960" y="336" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="50" y="410" width="740" height="30" rx="15" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/><text x="66" y="430" font-size="13" fill="#9A3412" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">코드가 두 덩어리로 나뉘어 오면 &quot;하나로 합쳐서 다시 줘&quot; 라고 한다</text>
  <line x1="14" y1="494" x2="986" y2="494" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="524" r="12" fill="#F97316"/><text x="34" y="529" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="529" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">onOpen 은 시트를 열 때 메뉴를 만드는 부분이다. 이것이 있어야 버튼이 생긴다</text><circle cx="34" cy="554" r="12" fill="#F97316"/><text x="34" y="559" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="559" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">아래가 실제로 일하는 부분이다. 줄마다 한글 주석이 붙어 있는지 확인한다</text>
</svg>
