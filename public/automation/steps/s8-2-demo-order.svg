<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-label="8교시 2단계 — 3분 시연 순서를 다섯 줄로 정한 화면">
  <title>8교시 2단계 — 3분 시연 순서를 다섯 줄로 정한 화면</title>
  <rect x="0" y="0" width="1000" height="570" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="410" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <text x="60" y="104" font-size="15" fill="#202124" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3분 시연 순서 — 이 순서를 벗어나지 않는다</text><rect x="60" y="122" width="880" height="46" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="136" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 145 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="149.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">① 원본 시트를 보여 주고 중복 두 줄을 손으로 짚는다</text><rect x="864" y="133" width="58" height="24" rx="12" fill="#E8F0FE"/><text x="893" y="149.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">30초</text><rect x="60" y="168" width="880" height="46" fill="#FBFCFD" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="182" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 191 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="195.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">② 상단 자동화 메뉴를 눌러 실행한다</text><rect x="864" y="179" width="58" height="24" rx="12" fill="#E8F0FE"/><text x="893" y="195.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">20초</text><rect x="60" y="214" width="880" height="46" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="228" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 237 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="241.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">③ 알림창 숫자를 소리 내어 읽는다 — 3건에서 2건, 삭제 1건</text><rect x="864" y="225" width="58" height="24" rx="12" fill="#E8F0FE"/><text x="893" y="241.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">20초</text><rect x="60" y="260" width="880" height="46" fill="#FBFCFD" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="274" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 283 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="287.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">④ 정리본과 삭제목록 시트를 차례로 보여 준다</text><rect x="864" y="271" width="58" height="24" rx="12" fill="#E8F0FE"/><text x="893" y="287.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">40초</text><rect x="60" y="306" width="880" height="46" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="320" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 329 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="333.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">⑤ 원본이 그대로임을 보여 주고 마친다</text><rect x="864" y="317" width="58" height="24" rx="12" fill="#E8F0FE"/><text x="893" y="333.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">30초</text><rect x="52" y="114" width="896" height="62" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="145" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="150" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="52" y="206" width="896" height="62" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="237" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="242" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="52" y="298" width="896" height="62" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="329" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="334" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><rect x="60" y="376" width="720" height="30" rx="15" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/><text x="76" y="396" font-size="13" fill="#9A3412" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">코드는 보여 주지 않는다 — 보는 사람이 알고 싶은 것은 결과뿐이다</text>
  <line x1="14" y1="444" x2="986" y2="444" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="474" r="12" fill="#F97316"/><text x="34" y="479" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="479" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">문제를 먼저 눈으로 보여 준다. 중복 두 줄을 짚는 30초가 시연에서 가장 중요하다</text><circle cx="34" cy="504" r="12" fill="#F97316"/><text x="34" y="509" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="509" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">숫자를 소리 내어 읽는다. 화면만 보여 주면 아무도 확인하지 않는다</text><circle cx="34" cy="534" r="12" fill="#F97316"/><text x="34" y="539" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="539" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">원본이 그대로라는 것으로 끝낸다 — 듣는 사람이 가장 걱정하는 부분이다</text>
</svg>
