<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" role="img" aria-label="3교시 2단계 — 만들 도구의 화면을 손그림처럼 스케치한 화면">
  <title>3교시 2단계 — 만들 도구의 화면을 손그림처럼 스케치한 화면</title>
  <rect x="0" y="0" width="1000" height="630" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="470" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <rect x="70" y="100" width="860" height="34" rx="6" fill="#EEF2F7" stroke="#D5DAE2" stroke-width="1"/><text x="84" y="123" font-size="13.5" fill="#202124" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">신청 명단 정리 — 내 시트 화면</text><text x="70" y="164" font-size="12.5" fill="#6B7280" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">① 상단 메뉴에 &quot;자동화&quot; 항목이 생긴다 — 여기서 실행한다</text><rect x="70" y="180" width="320" height="38" rx="6" fill="#1A73E8" stroke="#1A73E8" stroke-width="1"/><text x="230" y="203.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">자동화 ▸ 명단 정리 실행</text><rect x="70" y="230" width="860" height="26" fill="#EEF1F5" stroke="#D5DAE2" stroke-width="1"/><text x="82" y="248" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">원본: 신청접수 (손대지 않는다)</text><rect x="70" y="256" width="860" height="26" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="82" y="265" width="430" height="8" rx="4" fill="#EDF0F4"/><rect x="70" y="282" width="860" height="26" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="82" y="291" width="430" height="8" rx="4" fill="#EDF0F4"/><rect x="70" y="308" width="860" height="26" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="82" y="317" width="430" height="8" rx="4" fill="#EDF0F4"/><rect x="70" y="352" width="860" height="26" fill="#EEF1F5" stroke="#D5DAE2" stroke-width="1"/><text x="82" y="370" font-size="12.5" fill="#5F6368" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">결과: 정리본 (새로 만들어진다)</text><rect x="70" y="378" width="860" height="26" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="82" y="387" width="430" height="8" rx="4" fill="#EDF0F4"/><rect x="70" y="404" width="860" height="26" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="82" y="413" width="430" height="8" rx="4" fill="#EDF0F4"/><rect x="62" y="172" width="336" height="54" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="420" cy="199" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="420" y="204" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="62" y="222" width="876" height="120" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="960" cy="282" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="960" y="287" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="62" y="344" width="876" height="94" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="960" cy="391" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="960" y="396" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="504" x2="986" y2="504" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="534" r="12" fill="#F97316"/><text x="34" y="539" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="539" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">사람이 누를 곳은 딱 하나로 정한다 — 버튼이 둘 이상이면 쓰는 사람이 헷갈린다</text><circle cx="34" cy="564" r="12" fill="#F97316"/><text x="34" y="569" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="569" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">원본 자료는 절대 고치지 않는다. 이 원칙을 그림에 적어 두면 AI 도 그대로 만든다</text><circle cx="34" cy="594" r="12" fill="#F97316"/><text x="34" y="599" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="599" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">결과는 새 시트에 쓴다. 잘못 돌아도 원본이 남아 있으면 다시 하면 그만이다</text>
</svg>
