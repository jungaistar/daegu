  <text x="466" y="87" font-size="12.5" fill="#3C4043" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">신청현황_요약  ▾</text>

  <!-- 코드 영역 -->
  <rect x="228" y="106" width="742" height="228" fill="#FFFFFF" stroke="#E6E8EC"/>
  <text x="262" y="128" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">1</text><text x="276" y="128" font-size="12.5" fill="#1967D2" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">function</text><text x="336.8" y="128" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"> 신청현황_요약() {</text><text x="262" y="150" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">2</text><text x="276" y="150" font-size="12.5" fill="#1967D2" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const</text><text x="329.2" y="150" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"> sheet = SpreadsheetApp.getActive().getSheetByName("신청접수");</text><text x="262" y="172" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">3</text><text x="276" y="172" font-size="12.5" fill="#1967D2" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const</text><text x="329.2" y="172" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"> data = sheet.getDataRange().getValues();</text><text x="262" y="194" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">4</text><text x="276" y="194" font-size="12.5" fill="#1967D2" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"></text><text x="276" y="194" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"></text><text x="262" y="216" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">5</text><text x="276" y="216" font-size="12.5" fill="#5F8C3F" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  //</text><text x="306.4" y="216" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"> 1행은 제목 행이므로 제외한다</text><text x="262" y="238" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">6</text><text x="276" y="238" font-size="12.5" fill="#1967D2" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const</text><text x="329.2" y="238" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"> rows = data.slice(1);</text><text x="262" y="260" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">7</text><text x="276" y="260" font-size="12.5" fill="#1967D2" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  const</text><text x="329.2" y="260" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"> 합계 = rows.reduce((s, r) =&gt; s + Number(r[3] || 0), 0);</text><text x="262" y="282" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">8</text><text x="276" y="282" font-size="12.5" fill="#1967D2" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"></text><text x="276" y="282" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"></text><text x="262" y="304" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">9</text><text x="276" y="304" font-size="12.5" fill="#1967D2" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">  Logger</text><text x="336.8" y="304" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">.log("건수: " + rows.length + " / 합계: " + 합계);</text><text x="262" y="326" font-size="11.5" fill="#9AA0A6" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace" text-anchor="end">10</text><text x="276" y="326" font-size="12.5" fill="#1967D2" font-weight="600" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace">}</text><text x="283.6" y="326" font-size="12.5" fill="#202124" font-weight="400" font-family="'D2Coding','Consolas','Menlo','Courier New',monospace"></text>

