  <text x="44" y="398" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>


  <line x1="14" y1="482" x2="986" y2="482" stroke="#E6E8EC" stroke-width="1.5"/>

  <circle cx="34" cy="512" r="12" fill="#F97316"/>
  <text x="34" y="517" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text>
  <text x="56" y="517" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">AI 가 만들어 준 코드를 여기에 통째로 붙여넣는다 — 한 글자도 고치지 않아도 된다</text>
  <circle cx="34" cy="542" r="12" fill="#F97316"/>
  <text x="34" y="547" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text>
  <text x="56" y="547" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">실행할 함수 이름을 고르고 [▶ 실행] 을 누른다. 첫 실행 때만 권한 승인 창이 뜬다</text>
  <circle cx="34" cy="572" r="12" fill="#F97316"/>
  <text x="34" y="577" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <text x="56" y="577" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">실행 로그에 "실행이 완료됨" 과 계산 결과가 보이면 성공. 빨간 줄이 나오면 그 문장을 그대로 AI 에게 붙여넣는다</text>
