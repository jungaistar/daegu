<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 724" width="1000" height="724" role="img" aria-label="자료 입력 판정 흐름 — 고유식별정보, 이름·연락처, 대외비 세 관문과 각 조치">
  <title>자료 입력 판정 흐름 — 고유식별정보, 이름·연락처, 대외비 세 관문과 각 조치</title>
  <rect width="1000" height="724" fill="#FFFFFF"/>

  <rect x="290" y="40" width="420" height="84" rx="12" fill="#FFF6ED" stroke="#F0B27A" stroke-width="1.5"/>
  <text x="500" y="74" font-size="13.5" fill="#9A5B12" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">주민등록번호·외국인등록번호·</text><text x="500" y="94" font-size="13.5" fill="#9A5B12" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">운전면허번호가 있나?</text>
  
  <circle cx="44" cy="70" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="44" y="75" font-size="14" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">1</text>
  <path d="M290 70 h-40 v40" stroke="#F0B27A" stroke-width="2" fill="none"/>
  <path d="M244 104 l6 6 l6 -6" fill="none" stroke="#F0B27A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="262" y="62" font-size="11.5" fill="#C2410C" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">있다</text>
  <rect x="86" y="116" width="328" height="58" rx="10" fill="#FEF2F2" stroke="#F5C2C2"/>
  <text x="102" y="140" font-size="13" fill="#B42318" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">해당 열을 삭제한다</text>
  <text x="102" y="160" font-size="11.5" fill="#9A3412" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">지우지 못하면 이 업무는 자동화하지 않는다</text>
  <text x="724" y="62" font-size="11.5" fill="#0E6BA8" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">없다</text>
  <path d="M500 130 v54" stroke="#B6C0CC" stroke-width="2"/>
  <path d="M494 178 l6 6 l6 -6" fill="none" stroke="#B6C0CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290" y="190" width="420" height="64" rx="12" fill="#FFF6ED" stroke="#F0B27A" stroke-width="1.5"/>
  <text x="500" y="224" font-size="13.5" fill="#9A5B12" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">이름·연락처·주소가 있나?</text>
  
  <circle cx="44" cy="220" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="44" y="225" font-size="14" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">2</text>
  <path d="M290 220 h-40 v40" stroke="#F0B27A" stroke-width="2" fill="none"/>
  <path d="M244 254 l6 6 l6 -6" fill="none" stroke="#F0B27A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="262" y="212" font-size="11.5" fill="#C2410C" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">있다</text>
  <rect x="86" y="266" width="328" height="58" rx="10" fill="#F5FAFE" stroke="#D7E9F7"/>
  <text x="102" y="290" font-size="13" fill="#084D7C" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">민원인A · 담당자B 로 바꾼다</text>
  <text x="102" y="310" font-size="11.5" fill="#4B5563" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이름 없이도 집계는 똑같이 된다</text>
  <text x="724" y="212" font-size="11.5" fill="#0E6BA8" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">없다</text>
  <path d="M500 260 v54" stroke="#B6C0CC" stroke-width="2"/>
  <path d="M494 308 l6 6 l6 -6" fill="none" stroke="#B6C0CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290" y="320" width="420" height="84" rx="12" fill="#FFF6ED" stroke="#F0B27A" stroke-width="1.5"/>
  <text x="500" y="354" font-size="13.5" fill="#9A5B12" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">대외비·직무상 비밀·</text><text x="500" y="374" font-size="13.5" fill="#9A5B12" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">미공개 감사자료인가?</text>
  
  <circle cx="44" cy="350" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="44" y="355" font-size="14" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">3</text>
  <path d="M290 350 h-40 v40" stroke="#F0B27A" stroke-width="2" fill="none"/>
  <path d="M244 384 l6 6 l6 -6" fill="none" stroke="#F0B27A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="262" y="342" font-size="11.5" fill="#C2410C" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">그렇다</text>
  <rect x="86" y="396" width="328" height="58" rx="10" fill="#FEF2F2" stroke="#F5C2C2"/>
  <text x="102" y="420" font-size="13" fill="#B42318" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">외부 AI 를 쓰지 않는다</text>
  <text x="102" y="440" font-size="11.5" fill="#9A3412" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">기관 내부 도구만 사용하거나 수작업</text>
  <text x="724" y="342" font-size="11.5" fill="#0E6BA8" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">아니다</text>
  
  <path d="M500 410 v54" stroke="#B6C0CC" stroke-width="2"/>
  <path d="M494 458 l6 6 l6 -6" fill="none" stroke="#B6C0CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290" y="470" width="420" height="58" rx="12" fill="#E9F5FE" stroke="#B6D5EC" stroke-width="1.5"/>
  <text x="500" y="496" font-size="14" fill="#084D7C" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">여기까지 통과하면 올려도 된다</text>
  <text x="500" y="516" font-size="12" fill="#4B5563" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">단, 소속 기관에 AI 이용 지침이 있으면 그 지침이 우선한다</text>
  
  <circle cx="44" cy="499" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="44" y="504" font-size="14" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">4</text>
  <line x1="14" y1="568" x2="986" y2="568" stroke="#E6E8EC" stroke-width="1.5"/>

  <circle cx="34" cy="598" r="12" fill="#F97316"/>
  <text x="34" y="603" font-size="13" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">1</text>
  <text x="56" y="603" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">고유식별정보는 가명 처리도 안 된다. 지우거나, 못 지우면 그 업무는 자동화 대상에서 뺀다</text>
  <circle cx="34" cy="628" r="12" fill="#F97316"/>
  <text x="34" y="633" font-size="13" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">2</text>
  <text x="56" y="633" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이름·연락처는 A·B·C 로 바꾸면 된다. 대부분의 집계·분류는 이름 없이도 똑같이 나온다</text>
  <circle cx="34" cy="658" r="12" fill="#F97316"/>
  <text x="34" y="663" font-size="13" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">3</text>
  <text x="56" y="663" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">대외비는 판단하지 말고 무조건 멈춘다. 애매하면 상급자에게 묻는 것이 정답이다</text>
  <circle cx="34" cy="688" r="12" fill="#F97316"/>
  <text x="34" y="693" font-size="13" fill="#fff" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" text-anchor="middle">4</text>
  <text x="56" y="693" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">세 관문을 통과해도 기관 지침이 우선한다 — 지침을 먼저 확인하고 시작한다</text>
</svg>
