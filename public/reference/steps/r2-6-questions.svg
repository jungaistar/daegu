<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 564" width="1000" height="564" role="img" aria-label="2단계 6번 — 연결한 도구별로 바로 써먹을 수 있는 질문 다섯 가지">
  <title>2단계 6번 — 연결한 도구별로 바로 써먹을 수 있는 질문 다섯 가지</title>
  <rect x="0" y="0" width="1000" height="564" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="404" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <text x="60" y="104" font-size="15" fill="#202124" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">내 부서에서 바로 써먹을 질문</text><rect x="60" y="122" width="880" height="46" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="136" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 145 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="149.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">지방공무원 복무규정에서 연가 관련 조문을 원문과 함께 알려 줘</text><rect x="876" y="133" width="46" height="24" rx="12" fill="#E8F0FE"/><text x="899" y="149.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">법령</text><rect x="60" y="168" width="880" height="46" fill="#FBFCFD" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="182" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 191 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="195.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">최근 3년 대구 청년 고용률을 출처와 함께 표로 정리해 줘</text><rect x="876" y="179" width="46" height="24" rx="12" fill="#E8F0FE"/><text x="899" y="195.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">통계</text><rect x="60" y="214" width="880" height="46" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="228" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 237 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="241.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이 주소의 건축물대장에서 용도·연면적·사용승인일을 알려 줘</text><rect x="876" y="225" width="46" height="24" rx="12" fill="#E8F0FE"/><text x="899" y="241.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">건축</text><rect x="60" y="260" width="880" height="46" fill="#FBFCFD" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="274" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 283 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="287.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">대구 ○○중학교 이번 달 급식 식단과 학사일정을 정리해 줘</text><rect x="876" y="271" width="46" height="24" rx="12" fill="#E8F0FE"/><text x="899" y="287.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">학교</text><rect x="60" y="306" width="880" height="46" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><rect x="76" y="320" width="18" height="18" rx="4" fill="#188038" stroke="#188038" stroke-width="1.4"/><path d="M80 329 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="333.5" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">스마트 가로등 관련 최근 특허 출원 동향을 정리해 줘</text><rect x="876" y="317" width="46" height="24" rx="12" fill="#E8F0FE"/><text x="899" y="333.5" font-size="12" fill="#174EA6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">특허</text><rect x="52" y="114" width="896" height="108" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="168" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="173" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="52" y="206" width="896" height="108" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="260" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="265" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="60" y="356" width="800" height="30" rx="15" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/><text x="76" y="376" font-size="13" fill="#9A3412" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">개인정보·대외비는 넣지 않는다 — 공개된 외부 서버다. 공개 자료 조회에만 쓴다</text><circle cx="896" cy="371" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="896" y="376" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="438" x2="986" y2="438" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="468" r="12" fill="#F97316"/><text x="34" y="473" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="473" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">법령·통계는 오늘 바로 쓸 수 있다. 조문 번호나 연도만 내 업무로 바꾸면 된다</text><circle cx="34" cy="498" r="12" fill="#F97316"/><text x="34" y="503" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="503" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">건축·학교는 담당 부서에서 특히 유용하다. 주소나 학교 이름만 넣는다</text><circle cx="34" cy="528" r="12" fill="#F97316"/><text x="34" y="533" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="533" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">질문에 개인정보를 섞지 않는다. 이름·주민번호·연락처가 들어가면 그 질문은 하지 않는다</text>
</svg>
