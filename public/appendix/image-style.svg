  <text x="236" y="255" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>

  <rect x="286" y="436" width="632" height="72" rx="12" fill="#FFF6ED" stroke="#F5D3AF"/>
  <text x="302" y="462" font-size="13" fill="#9A5B12" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">원본 사진은 따로 보관하고, 결과물은 "AI로 그린 그림"임을 밝히고 쓴다.</text>
  <text x="302" y="488" font-size="12.5" fill="#9A5B12" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">단체 사진 속 다른 사람 얼굴은 당사자 동의를 먼저 받는다.</text>
  <rect x="280" y="430" width="644" height="84" rx="12" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  
