  <text x="236" y="575" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text>

  <line x1="14" y1="652" x2="966" y2="652" stroke="#E6E8EC" stroke-width="1.5"/>

  <circle cx="34" cy="682" r="12" fill="#F97316"/>
  <text x="34" y="687" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text>
  <text x="56" y="687" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">바꾸고 싶은 사진 한 장을 붙인다 — 인물이 너무 작게 나온 사진은 얼굴이 뭉개진다</text>
  <circle cx="34" cy="712" r="12" fill="#F97316"/>
  <text x="34" y="717" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text>
  <text x="56" y="717" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">"무엇을 그대로 둘지" 를 먼저 쓰고 "무엇을 바꿀지" 를 뒤에 쓴다 — 순서가 결과를 가른다</text>
  <circle cx="34" cy="742" r="12" fill="#F97316"/>
  <text x="34" y="747" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <text x="56" y="747" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">원본과 나란히 놓고 얼굴이 다른 사람이 되지 않았는지 먼저 확인한다</text>
  <circle cx="34" cy="772" r="12" fill="#F97316"/>
  <text x="34" y="777" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">4</text>
  <text x="56" y="777" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">원본은 지우지 말고 보관. 공개할 때는 AI로 만든 그림임을 밝히고, 남의 얼굴은 동의부터</text>
