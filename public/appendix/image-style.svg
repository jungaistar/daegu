  <rect x="472" y="122" width="470" height="108" rx="12" fill="#EAF2FA" stroke="#CBDDEE"/>
  <text x="488" y="148" font-size="13" fill="#374151" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">[첨부] 우리가족_공원.jpg</text><text x="488" y="169" font-size="13" fill="#374151" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">이 사진을 지브리풍 그림으로 바꿔 줘.</text><text x="488" y="190" font-size="13" fill="#374151" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">인물의 얼굴 생김새와 옷차림, 서 있는 위치는 그대로 두고</text><text x="488" y="211" font-size="13" fill="#374151" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">색감만 부드럽게, 배경의 나무와 하늘을 조금 더 풍성하게.</text>
  <rect x="466" y="116" width="482" height="120" rx="12" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  
