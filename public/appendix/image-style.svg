  <text x="686" y="292" font-size="12.5" fill="#374151" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">· 얼굴 생김새 — 그대로</text>
  <text x="686" y="318" font-size="12.5" fill="#374151" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">· 옷차림·위치 — 그대로</text>
  <text x="686" y="344" font-size="12.5" fill="#0E6BA8" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">· 색감·질감 — 부드럽게</text>
  <text x="686" y="370" font-size="12.5" fill="#0E6BA8" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">· 배경 — 풍성하게</text>
  <rect x="280" y="226" width="644" height="198" rx="12" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  
