<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 748" width="980" height="748" role="img" aria-label="Claude 파일 요약 화면 — 파일 첨부, 규칙과 복수 요청, 결과 구조 확인">
  <title>Claude 파일 요약 화면 — 파일 첨부, 규칙과 복수 요청, 결과 구조 확인</title>
  <rect width="980" height="748" fill="#FFFFFF"/>

  <!-- 브라우저 창 -->
  <rect x="14" y="14" width="952" height="582" rx="16" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/>
  <path d="M14 30 a16 16 0 0 1 16 -16 h920 a16 16 0 0 1 16 16 v26 h-952 z" fill="#F3F5F8"/>
  <circle cx="40" cy="42" r="6" fill="#FF5F57"/>
  <circle cx="60" cy="42" r="6" fill="#FEBC2E"/>
  <circle cx="80" cy="42" r="6" fill="#28C840"/>
  <rect x="336" y="30" width="308" height="24" rx="12" fill="#E7EAEF"/>
  <text x="490" y="47" font-size="13" fill="#6B7280" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">claude.ai</text>

  <!-- 사이드바 -->
  <line x1="234" y1="56" x2="234" y2="596" stroke="#E6E8EC" stroke-width="1.5"/>
  <rect x="26" y="76" width="188" height="32" rx="9" fill="#D97706"/>
  <text x="120" y="97" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">+ 새 대화</text>
  
    <rect x="26" y="120" width="188" height="28" rx="8" fill="#EDF1F6"/>
    <text x="40" y="139" font-size="12.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">새 대화</text>
    <rect x="26" y="158" width="188" height="28" rx="8" fill="none"/>
    <text x="40" y="177" font-size="12.5" fill="#7B828C" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">규정집 요약</text>
    <rect x="26" y="196" width="188" height="28" rx="8" fill="none"/>
    <text x="40" y="215" font-size="12.5" fill="#7B828C" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">부서 제출본 비교</text>

  <!-- 본문 -->
  <text x="286" y="94" font-size="17" font-weight="700" fill="#111827" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">Claude — 파일 요약</text>
  
    <rect x="472" y="122" width="470" height="87" rx="12" fill="#EAF2FA" stroke="#CBDDEE"/><text x="488" y="148" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">[첨부] 2026_경로당_보수사업_계획.pdf</text><text x="488" y="169" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">첨부한 문서만 근거로. 없는 내용은 "문서에 없음".</text><text x="488" y="190" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">먼저 5줄 요약, 그다음 놓치기 쉬운 3가지.</text>
    <rect x="286" y="244" width="632" height="150" rx="12" fill="#F7F8FA" stroke="#E6E8EC"/><text x="302" y="270" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">【5줄 요약】</text><text x="302" y="291" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">노후 경로당 보수 지원 사업 계획서입니다. (1쪽)</text><text x="302" y="312" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">신청 기간은 9월 1일 ~ 19일입니다. (3쪽)</text><text x="302" y="333" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"></text><text x="302" y="354" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">【놓치기 쉬운 3가지】</text><text x="302" y="375" font-size="13" fill="#374151" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1. 견적서는 업체 발행본만 인정됩니다. (4쪽)</text>

  <!-- 입력창 -->
  <rect x="286" y="504" width="656" height="60" rx="14" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.5"/>
  <circle cx="318" cy="534" r="15" fill="#EDF1F5"/>
  <path d="M312 529 l7 -7 a4.5 4.5 0 0 1 6.4 6.4 l-9 9 a7 7 0 0 1 -10 -10 l9 -9"
        fill="none" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round"/>
  <text x="344" y="539" font-size="13.5" fill="#9AA1AB" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">Claude에게 메시지 보내기</text>
  <rect x="886" y="518" width="42" height="32" rx="9" fill="#D97706"/>
  <path d="M900 540 l7 -8 l7 8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="280" y="498" width="668" height="72" rx="12" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  
    <circle cx="236" cy="534" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="236" y="539" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text>

  <rect x="466" y="116" width="482" height="99" rx="12" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="280" y="238" width="644" height="162" rx="12" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  
  
    <circle cx="236" cy="140" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="236" y="145" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text>
    <circle cx="236" cy="262" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="236" y="267" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>

  <!-- 범례 -->
  <line x1="14" y1="618" x2="966" y2="618" stroke="#E6E8EC" stroke-width="1.5"/>
  
    <circle cx="34" cy="648" r="12" fill="#F97316"/>
    <text x="34" y="653" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text>
    <text x="56" y="653" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">클립을 누르거나 파일을 창 위로 끌어놓는다 — 긴 문서일수록 유리하다</text>
    <circle cx="34" cy="678" r="12" fill="#F97316"/>
    <text x="34" y="683" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text>
    <text x="56" y="683" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">규칙과 두 가지 요청을 한 번에 보낸다</text>
    <circle cx="34" cy="708" r="12" fill="#F97316"/>
    <text x="34" y="713" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
    <text x="56" y="713" font-size="14.5" fill="#1F2937" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">요청한 두 덩어리가 모두 나왔는지 확인한다</text>
</svg>
