  <line x1="14" y1="486" x2="986" y2="486" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="516" r="12" fill="#F97316"/><text x="34" y="521" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="521" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">가운데가 큰 갈래, 바깥으로 갈수록 구체적인 사업이다</text><circle cx="34" cy="546" r="12" fill="#F97316"/><text x="34" y="551" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="551" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">점을 누르면 그 제도와 이어진 것만 남는다 — 설명할 범위를 좁힐 수 있다</text><circle cx="34" cy="576" r="12" fill="#F97316"/><text x="34" y="581" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="581" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">우리 부서 사업으로 같은 그림을 만들면 설명이 훨씬 쉬워진다</text>
