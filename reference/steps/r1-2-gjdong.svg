<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-label="1단계 2번 — gjdong 웹앱에 대구 민원 주소를 붙여넣어 표준주소로 정리한 화면">
  <title>1단계 2번 — gjdong 웹앱에 대구 민원 주소를 붙여넣어 표준주소로 정리한 화면</title>
  <rect x="0" y="0" width="1000" height="490" fill="#FFFFFF"/>
  <rect x="14" y="14" width="972" height="330" rx="14" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><path d="M14 28 a14 14 0 0 1 14 -14 h944 a14 14 0 0 1 14 14 v26 h-972 z" fill="#F3F5F8"/><circle cx="40" cy="40" r="6" fill="#FF5F57"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#28C840"/><rect x="340" y="28" width="320" height="24" rx="12" fill="#E7EAEF"/><text x="500" y="45" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">gjdong.vercel.app</text><line x1="14" y1="54" x2="986" y2="54" stroke="#E6E8EC" stroke-width="1"/>
  <text x="50" y="96" font-size="15" fill="#202124" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">주소를 붙여넣으면 표준주소로 정리됩니다</text><rect x="50" y="116" width="420" height="118" rx="8" fill="#FFFFFF" stroke="#D5DAE2" stroke-width="1"/><text x="64" y="138" font-size="11.5" fill="#6B7280" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">붙여넣은 주소 (민원 서식에서 그대로)</text><text x="64" y="164" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">대구 수성구 범어동 1234-5</text><text x="64" y="186" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">대구광역시 중구 동인동1가 2</text><text x="64" y="208" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">달서구 월성동 삼성래미안 101동</text><text x="492" y="180" font-size="26" fill="#9AA0A6" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">›</text><rect x="514" y="116" width="416" height="118" rx="8" fill="#F6FBF7" stroke="#BFE3C9" stroke-width="1"/><text x="528" y="138" font-size="11.5" fill="#188038" font-weight="700" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">정리된 표준주소</text><text x="528" y="164" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">대구광역시 수성구 달구벌대로 2400</text><text x="528" y="186" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">대구광역시 중구 국채보상로 100</text><text x="528" y="208" font-size="12.5" fill="#202124" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">대구광역시 달서구 월배로 50</text><rect x="50" y="252" width="150" height="38" rx="6" fill="#1A73E8" stroke="#1A73E8" stroke-width="1"/><text x="125" y="275.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">표준주소로 정리</text><rect x="212" y="252" width="130" height="38" rx="6" fill="#F1F3F4" stroke="#DADCE0" stroke-width="1"/><text x="277" y="275.5" font-size="13" fill="#3C4043" font-weight="400" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">결과 복사</text><rect x="42" y="108" width="436" height="134" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="30" cy="175" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="30" y="180" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><rect x="42" y="244" width="166" height="54" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="125" cy="318" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="125" y="323" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><rect x="506" y="108" width="432" height="134" rx="8" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/><circle cx="960" cy="175" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/><text x="960" y="180" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text>
  <line x1="14" y1="364" x2="986" y2="364" stroke="#E6E8EC" stroke-width="1.5"/><circle cx="34" cy="394" r="12" fill="#F97316"/><text x="34" y="399" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">1</text><text x="56" y="399" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">민원 서식에서 긁어온 주소를 그대로 붙여넣는다 — 줄 수가 많아도 된다</text><circle cx="34" cy="424" r="12" fill="#F97316"/><text x="34" y="429" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">2</text><text x="56" y="429" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">정리 버튼을 한 번 누른다. 몇 백 건도 몇 초면 끝난다</text><circle cx="34" cy="454" r="12" fill="#F97316"/><text x="34" y="459" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">3</text><text x="56" y="459" font-size="14.5" fill="#1F2937" font-weight="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">도로명 기준 표준주소가 나온다. 복사해서 우리 대장 시트에 붙이면 된다</text>
</svg>
